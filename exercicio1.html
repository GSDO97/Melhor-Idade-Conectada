<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Melhor Idade Conectada</title>
<link rel="stylesheet" href="skin.css">

<body>

<h2>Desafio do Dia</h2>
<a href="javascript:void(0)" onclick="lerDesafioDia()" class="audio-desafio-01">
🔊 Ouvir Desafio
</a>

<p id="desafio"></p>

<script>
//LISTA DE DESAFIOS DO DIA
const desafios = [
"Dê bom dia para alguém hoje.",
"Caminhe até o portão e respire fundo.",
"Coloque uma música e movimente o corpo por 5 minutos.",
"Faça alongamento dos braços e pernas.",
"Escreva uma lembrança feliz do passado.",
"Ligue para um familiar ou amigo.",
"Faça um caça-palavras ou palavra cruzada."
];

let numero = Math.floor(Math.random() * desafios.length);

document.getElementById("desafio").innerHTML = desafios[numero];
function lerDesafioDia(){

    const texto = document.getElementById("desafio").innerText;

    const fala = new SpeechSynthesisUtterance(
        "Desafio do dia. " + texto
    );

    fala.lang = "pt-BR";

    speechSynthesis.cancel();
    speechSynthesis.speak(fala);
}

</script>

</body>
</html>
